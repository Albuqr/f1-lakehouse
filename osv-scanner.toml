# Pillow 12.3.0: advisories with no usable fix yet. The fix is only in pillow 13.0.0 and
# Streamlit (up to 1.66.0) requires pillow<13, so the dependency cannot be bumped.
# All nine need a crafted image file to be decoded (JPEG/TIFF/GIF/PPM/EPS/PDF), and this app
# never opens images from users. Listed by ID so any new advisory still fails the check.
# Review when a Streamlit release allows pillow 13, or by the date below.

[[IgnoredVulns]]
id = "GHSA-462x-pgg6-55fp"
ignoreUntil = 2027-01-21
reason = "pillow 12.3.0 via streamlit<13; the app never decodes user-supplied images"

