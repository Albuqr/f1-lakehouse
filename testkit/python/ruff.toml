# Configuração de referência do testkit — usada só se o projeto não tiver [tool.ruff] próprio.
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "venv", "migrations", "node_modules", "testkit"]

[lint]
select = [
  "E", "W", "F",   # pycodestyle + pyflakes
  "I",             # ordenação de imports
  "B",             # bugbear (bugs prováveis)
  "UP",            # sintaxe moderna
  "S",             # segurança (equivalente ao bandit)
  "C4", "SIM", "RET", "PIE",
  "DTZ",           # datas sem fuso
  "T20",           # print esquecido
  "ERA",           # código comentado
  "PL",            # pylint
  "RUF",
]
ignore = ["PLR0913", "PLR2004", "E501"]

[lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "T20"]
"**/test_*.py" = ["S101", "PLR2004", "T20"]
"**/conftest.py" = ["S101"]
